items.artifacts.driedrose.spawned=“唉？前辈我不就在这里吗？”
items.artifacts.driedrose.no_charge=栀子梦：稍等一下！前辈我还没有准备好...
items.artifacts.driedrose.cursed=是我…是我…是我…害死的梦前辈…
items.artifacts.driedrose.no_space=栀子梦：呜…这里没有可以落脚的地方…
items.artifacts.driedrose.charged=栀子梦：唔嗯！前辈现在元气满满哦！
items.artifacts.driedrose.desc=一本明显陈旧沾满黄沙的笔记，封皮是一只可爱的香蕉鸟，里面记载了一位负重前行的前辈以天真与乐观对抗生活困苦的日常。\n无论遇到什么事，她都是那副天真烂漫而又单纯的微笑，似乎这样就可以抚平日常的伤痛。\n…直至她抱着理想倒在荒漠之中\n笔记本上似乎寄宿了这位前辈的一些精神能量，你可以通过这个笔记来聚集起这股能量让这位前辈出现在你身旁。

items.artifacts.driedrose.desc_no_quest=一本沾满黄沙的笔记本。\n\n它上面看起来残留了一些精神力量，但你现在还不知道如何使用它。
items.artifacts.driedrose.desc_hint=它似乎缺少了一些纸张。也许把纸张拼回来可以增强笔记。
items.artifacts.driedrose.desc_cursed=“原来是这样…梦前辈…是我害死的啊……是我是我是我是我是我……”\n一股强大的痛苦执念弥漫在这个笔记本上，外泄的执念甚至已经可以凝聚成实质直接对你发动攻击！
items.artifacts.driedrose.desc_weapon=梦前辈的武器：%s
items.artifacts.driedrose.desc_armor=梦前辈的盔甲：%s
items.artifacts.driedrose.desc_strength=梦前辈的力量：%s
