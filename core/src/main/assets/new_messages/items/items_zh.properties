items.weapon.melee.gun.sg.shootingstar.name=Shooting☆Star
items.weapon.melee.gun.sg.shootingstar.desc=玲纱心爱的霰弹枪。\n精心定制的枪身让人一看就知道是玲纱的枪。与可爱的外表不同，有着可以看出经历过很多战斗的痕迹。
items.weapon.melee.gun.sg.shootingstar.stats_desc=这把枪的射击伤害上限及其成长更低。\n这把枪会在射击时嘲讽吸引全层敌人，并对命中的敌人施加狂乱。
items.weapon.melee.gun.sg.shootingstar.discover_hint=通过在炼金配方中使用_SG_来发现这把特殊枪支。

items.weapon.melee.gun.sg.mtet.name=多战术(Multi-tactical)
items.weapon.melee.gun.sg.mtet.desc=艾米爱用的霰弹枪。\n正如其名，从强行突破到超常现象的应对，预想了各种各样的情况而制作的此枪。
items.weapon.melee.gun.sg.mtet.stats_desc=这把枪的射击伤害及其成长只有低一阶的数值。\n这把枪射击时有概率点燃敌人，并对燃烧中的敌人造成额外伤害，概率与强化等级有关。此效果与烈焰附魔独立计算。
items.weapon.melee.gun.sg.mtet.discover_hint=通过在炼金配方中使用_SG_来发现这把特殊枪支。

items.weapon.melee.gun.smg.smg_t1.name=1阶SMG
items.weapon.melee.gun.smg.smg_t1.desc=1阶的SMG，只有最低限度的性能。
items.weapon.melee.gun.smg.smg_t2.name=2阶SMG
items.weapon.melee.gun.smg.smg_t2.desc=2阶的SMG，性能较弱但总体及格。
items.weapon.melee.gun.smg.smg_t3.name=3阶SMG
items.weapon.melee.gun.smg.smg_t3.desc=3阶的SMG，具有良好的性能。
