items.artifacts.driedrose$wndghosthero.armor_prompt=选择一件护甲
items.artifacts.driedrose$wndghosthero.cant_unique=栀子梦：不行…这个东西我不会用哇！呜咦…
items.artifacts.driedrose$wndghosthero.cant_cursed=栀子梦：这件装备给我的感觉很奇怪…
items.artifacts.driedrose$wndghosthero.cant_strength_unknown=栀子梦：好重！我拿不动哇qwq
items.artifacts.driedrose$wndghosthero.cant_strength=好重！我拿不动哇qwq

##ghost hero
items.artifacts.driedrose$ghosthero.name=梦前辈
items.artifacts.driedrose$ghosthero.def_verb=闪避
items.artifacts.driedrose$ghosthero.discover_hint=你可通过某件神器遇到该单位。

items.artifacts.driedrose$ghosthero.hello=再次向你问好，%s。
items.artifacts.driedrose$ghosthero.introduce=我将冒险途中遇到的经历都记在了一个小本本上，上面充满了回忆，是我珍贵的东西呢。\n我已经不能再以肉体存活于世，但我的灵魂，似乎可以寄存于这里，也感谢你帮我找到它啦。\n只要你拿着这个笔记本，我就能听到你的呼唤，当我准备好后，我就会跑出来和你并肩作战!你也可以拿着这个笔记本指引我前进!\n我希望，我们能一起走完这趟旅程!
items.artifacts.driedrose$ghosthero.dialogue_sewers_1=这里的螃蟹好大!我从来没有见过!
items.artifacts.driedrose$ghosthero.dialogue_sewers_2=不知道现在的阿拜多斯什么样了呢，真想去看看......
items.artifacts.driedrose$ghosthero.dialogue_sewers_3=阿拜多斯之外的景色，可以和我讲讲吗?
items.artifacts.driedrose$ghosthero.dialogue_sewers_4=这团黏糊糊的绿色小生物是什么…呜哇！粘液沾到手上了！
items.artifacts.driedrose$ghosthero.dialogue_sewers_5=这里有点危险，不知道更深处会有些什么...
items.artifacts.driedrose$ghosthero.dialogue_sewers_6=好奇怪！这些老鼠和螃蟹是怎么长这么大的？
