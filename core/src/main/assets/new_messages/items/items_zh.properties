items.artifacts.capeofthorns.name=公主假面
items.artifacts.capeofthorns.desc=
items.artifacts.capeofthorns.desc_inactive=［数秘会］成员为亚津子所造就的一张神秘面具，此时它正散发着幽蓝色的光芒，入手质感坚硬而厚实，它似乎能积蓄不少能量并且能够在你受伤时释放出来为你提供有效的防护。

items.artifacts.capeofthorns.desc_active=面具似乎在释放其存储的能量，并将其辐射出一种防护力场。
items.artifacts.capeofthorns$thorns.inert=你的面具再次失效了。
items.artifacts.capeofthorns$thorns.radiating=你的面具正在释放存储的能量，你感到自己正在被保护着！
items.artifacts.capeofthorns$thorns.levelup=你的面具变得更强大了！
items.artifacts.capeofthorns$thorns.name=荆棘
items.artifacts.capeofthorns$thorns.desc=你的面具在你周围辐射能量，产生了一个偏斜力场！\n\n该效果下你受到的所有伤害都会被减少。此外，如果攻击者就在你旁边，被减少的伤害会反弹给攻击者。\n\n荆棘效果持续时间：%s回合

items.artifacts.chaliceofblood.name=大人的卡片
items.artifacts.chaliceofblood.ac_prick=付出
items.artifacts.chaliceofblood.yes=是的，我知道我在做什么
items.artifacts.chaliceofblood.no=不，我改主意了
items.artifacts.chaliceofblood.prick_warn=你每使用一次卡片都会使它吸取你头上光环的更多能量，但卡片也会进而强化你的自然生命回复速率作为交换。\n\n此次献祭会对自己造成_%1$d~%2$d点伤害_，不过自伤可被_物理、魔法防御与伤害减免_降低。若不计算伤害减免，则此次献祭会有 _%3$s%%的概率_耗尽你的生命力。\n\n你确定要为卡片供奉更多的生命力作为祭品？
items.artifacts.chaliceofblood.onprick=你握紧了这张卡片，同时感觉身体里有什么涌入了卡片中。
items.artifacts.chaliceofblood.ondeath=卡片将你的光环能量完全吸光了...你也随之失去了生命
items.artifacts.chaliceofblood.desc=散发着奇特力量的卡片，身为大人可以用它以一定代价为交换做到任何事。
items.artifacts.chaliceofblood.desc_cursed=“答应我…照顾好学生们。”\n卡片上传来的执念宛若千钧般沉重，压制着你的恢复能力！
items.artifacts.chaliceofblood.desc_1=虽然身为学生就算得到了卡片也没办法完全使用，但卡片外溢的能量还是可以提升一下自我回复的速度，\n你也可以选择像老师那样付出代价来提升卡片的力量，但那一定会很疼……
items.artifacts.chaliceofblood.desc_2=你光环中的一些能量被汇集到卡片里，你可以隐约感受到卡片在为你送来生命能量，提高了你的自然生命恢复速度。你还想继续握住这张卡片为它供给能量，即便你知道那很危险。
items.artifacts.chaliceofblood.desc_3=卡片此时荡漾起耀眼的光芒，你可以感受到它正在将能量不断供给于你，宛如那位大人就在身边默默支持守护你一般。

items.artifacts.cloakofshadows.name=暗影斗篷
items.artifacts.cloakofshadows.ac_stealth=潜行
items.artifacts.cloakofshadows.cooldown=你的斗篷还需要%d回合来重新激活。
items.artifacts.cloakofshadows.cursed=你不能使用被诅咒的斗篷。
items.artifacts.cloakofshadows.no_charge=你的斗篷充能不足无法使用。
items.artifacts.cloakofshadows.desc=这是盗贼多年前从皇家军械库窃取的一件无价的魔法斗篷。穿上时，可令穿戴者在短时间完全隐形。\n\n斗篷的使用次数越多，力量就会变得越强，使盗贼更频繁地隐形，且持续时间更长。
items.artifacts.cloakofshadows.discover_hint=某位英雄初始携带该物品。
