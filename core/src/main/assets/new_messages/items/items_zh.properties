items.conversionkit.desc=诺亚安装在枪械上的配件。只需安装在枪械上即可轻松改造枪械，提升性能。\n\n转换套件可以_安装在枪械上并可转移到其他枪械_。在转换套件安装状态下强化枪械时，可对转换套件进行最多1次强化，这次强化等级可在枪械之间转移。
