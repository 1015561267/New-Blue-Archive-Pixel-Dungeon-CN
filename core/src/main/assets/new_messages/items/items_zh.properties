items.artifacts.cloakofshadows$cloakstealth.levelup=你的斗篷变得更强大了！
items.artifacts.cloakofshadows$cloakstealth.name=影遁
items.artifacts.cloakofshadows$cloakstealth.desc=你身上的暗影斗篷正给予你隐形效果。你会一直拥有该状态，直到你自行取消或斗篷耗尽充能。\n\n当你在隐形时敌人无法攻击或追踪你。大部分物理攻击和魔法(比如卷轴和法杖)会立即解除隐形效果。\n\n距离下次消耗充能还有：%d回合

