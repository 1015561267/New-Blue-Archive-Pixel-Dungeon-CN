items.artifacts.masterthievesarmband.desc_cursed=“嗯，现在只有一个办法了”\n把钱都交出来\n你感觉自己的钱袋开始逐渐变轻……
items.artifacts.masterthievesarmband.desc_worn=带上头套后你不仅学到了白子的“先射眼睛后打腿”的战术，还可以洗劫商店，打劫你的敌人让她们把战利品交出来，\n虽然说这样做很容易召来追捕，但地牢里哪来的瓦尔基里学生？所以请随意猎取战利品吧！\n对未察觉你的敌人进行打劫更有效，每个敌人只能打劫一次，因为第二次已经没东西可抢了……

items.artifacts.sandalsofnature.name=亚津子花束
items.artifacts.sandalsofnature.name_1=亚津子花束
items.artifacts.sandalsofnature.name_2=亚津子花束
items.artifacts.sandalsofnature.name_3=“废土中的希望”
items.artifacts.sandalsofnature.ac_feed=喂食
items.artifacts.sandalsofnature.ac_root=扎根
items.artifacts.sandalsofnature.prompt=选择一粒种子
items.artifacts.sandalsofnature.levelup=你的花束更美丽了！
items.artifacts.sandalsofnature.absorb_seed=花束里增加了一朵新的花
items.artifacts.sandalsofnature.no_effect=你必须先给你的花束增加一粒种子
items.artifacts.sandalsofnature.low_charge=你的花束还没有足够的能量。
items.artifacts.sandalsofnature.prompt_target=选择一个位置
items.artifacts.sandalsofnature.out_of_range=那个位置超出了范围。
items.artifacts.sandalsofnature.desc_1=“充斥战火的废土之上，\n向阳花生来就带着风沙，\n在混凝土缝中生长，只图那一丝希望与光芒如今尘霾不再，风沙散华。\n夹缝中的向阳花，\n终于得以绽放。\n“宛如此时正在你手中，这束象征着奇迹的蓝色玫瑰花。”
items.artifacts.sandalsofnature.desc_2=现在的花束已经小有规模，比起原来的单调一种花增添了许多颜色，不过花束旁还有一些空缺，这束花还能够更加美丽。
items.artifacts.sandalsofnature.desc_3=在不断的加入花束下，怀中的花束更加繁华，沁人心脾的芬芳萦绕在身旁，但花束仍有可以点缀的空间。
items.artifacts.sandalsofnature.desc_4=“亚津子：是给我的吗？这束花……我会好好珍惜的……一直……”
items.artifacts.sandalsofnature.desc_hint=带着这束花，你感觉更加亲近自然了，不过花束中还有很多空余的位置，要不要试着加入一些花？
items.artifacts.sandalsofnature.desc_cursed=“希望…光芒？不，虚无才是你应该走的路…”\n来自［夫人］的注视充斥着虚无的阴冷，切断了你与自然的所有联系！
items.artifacts.sandalsofnature.desc_ability=你最后加入的种子此时在花束中绽放的最为鲜艳，在你使用花束亲近自然时还可以在3格内产生这种植物的效果。\n当前种子：_%s_\n需要充能：_%d%%_
items.artifacts.sandalsofnature.desc_seeds=你已经给花束投入了%d粒种子。

items.artifacts.skeletonkey.name=小雪的“万能钥匙”
items.artifacts.skeletonkey.ac_insert=插入
items.artifacts.skeletonkey.cursed=某前辈：我说过了，不可以再用这个了哦？。
items.artifacts.skeletonkey.prompt=选择一个目标
items.artifacts.skeletonkey.invalid_target=那里没有东西可上锁或解锁。
items.artifacts.skeletonkey.lock_no_space=你不能将一个单位锁在门内！
items.artifacts.skeletonkey.iron_charges=解开一把锁需要消耗1点充能。
items.artifacts.skeletonkey.gold_charges=解开一把金锁需要消耗2点充能。
items.artifacts.skeletonkey.lock_charges=上锁一道门需要消耗2点充能。
items.artifacts.skeletonkey.wall_charges=创造一面临时墙壁需要消耗2点充能。
items.artifacts.skeletonkey.crystal_charges=解开一把水晶锁需要消耗5点充能。
items.artifacts.skeletonkey.wont_open=钥匙出于某种原因拒绝适配这把锁。
items.artifacts.skeletonkey.locked_with_key=这扇门已被你的万能钥匙上锁。
items.artifacts.skeletonkey.force_lock=这把锁已被你的万能钥匙削弱。你成功将其强行解开。
items.artifacts.skeletonkey.discard=你弃置了多余的钥匙。
items.artifacts.skeletonkey.levelup=捏哈哈——万能钥匙变得更强了！
items.artifacts.skeletonkey.desc=某个吵吵闹闹的小粉毛虽然平时不着调，但在开锁方面的天赋可以说是出类拔萃，这个就是她高超技艺的证明！
items.artifacts.skeletonkey.desc_worn=这把由她亲自制作的钥匙毫不夸张的说可以打开所有的门。但为什么这样厉害的道具会被丢在地上并被你捡到呢？\n\n钥匙还可用于“锁定”你面前正向或斜向空间的空气，以创造一面持续10回合，3格宽的坚固墙壁。如果有空间可施展，锁定会将敌人击退。
items.artifacts.skeletonkey.desc_cursed=“呜哇——前辈我错了——我不该逃跑的……”“作为惩罚～你的钥匙我没收了哦，不可以再用了呢～”\n还有，其他的锁也被加固了哦，别想轻易解开了。
items.artifacts.skeletonkey$keywall.desc=一面被万能钥匙创造的临时魔法墙壁。

items.artifacts.talismanofforesight.name=千年地形分析仪
items.artifacts.talismanofforesight.ac_scry=启用
items.artifacts.talismanofforesight.low_charge=分析仪至少要充能5%才能探查。
items.artifacts.talismanofforesight.prompt=选择要探查的位置
items.artifacts.talismanofforesight.levelup=你的分析仪自动更新了新版本！
items.artifacts.talismanofforesight.full_charge=你的分析仪能量充沛！
items.artifacts.talismanofforesight.desc=由工程部研发的地形分析仪，可以侦查任何地形并分析情况。
items.artifacts.talismanofforesight.desc_worn=在必要时，还会提醒你周围的危险，相当方便省心，实在是出门旅行的不二之选。“我千年的科技！世界第一！”\n“你这家伙串台了吧！”\n\n分析仪可以花费能量去“探查”一个扇形的区域，揭示范围内所有的地格与秘密，并且暂时赋予你对范围内敌人与道具的灵视。
items.artifacts.talismanofforesight.desc_cursed=坏掉的分析仪需要加载好久才能进行启动，便捷的工具此时成了负担。
items.artifacts.talismanofforesight$foresight.name=危险预知
items.artifacts.talismanofforesight$foresight.uneasy=分析仪发出剧烈的震动！
items.artifacts.talismanofforesight$foresight.desc=你感到非常焦虑，仿佛周遭有未被发现的危险。

items.artifacts.timekeepershourglass.name=游戏暂停按钮
items.artifacts.timekeepershourglass.ac_activate=激活
items.artifacts.timekeepershourglass.deactivate=你取消了暂停。
items.artifacts.timekeepershourglass.no_charge=你的按钮充能还不足以用来激活。
items.artifacts.timekeepershourglass.cursed=你不能使用被诅咒的按钮。
items.artifacts.timekeepershourglass.onstasis=你周遭的世界似乎就在这一瞬间变化了。
items.artifacts.timekeepershourglass.onfreeze=游戏暂停，但你除外！
items.artifacts.timekeepershourglass.stasis=使我彻底停滞
items.artifacts.timekeepershourglass.freeze=冻结周围时间
items.artifacts.timekeepershourglass.prompt=你想要如何使用按钮？\n\n停滞你自己的时间，周遭的时间会继续正常流动，而你将身处冻结的时间中，动弹不得却也刀枪不入。每这样做一次，按钮都会消耗两点能量。\n\n冻结外界的时间，你的一举一动都将瞬间完成。这种冻结能够通过再次使用按钮或进行攻击随时取消。
items.artifacts.timekeepershourglass.desc=“喂！搞错了吧！这东西不可能作为游戏道具存在吧！\n“也许是某位sensei在凹总力战的时候按的太多导致掉落在游戏里了吧？不过这东西确实能暂停周围…还挺厉害的。”\n“话说我们这算不算是打破第三面墙了…””
items.artifacts.timekeepershourglass.desc_hint=这个按钮似乎缺少了一部分力量，也许有什么“珍惜资源”可以强化它
items.artifacts.timekeepershourglass.desc_cursed=“为什么又掉档了……明明只差一刀…我不甘心啊！就让你们也感受这份慢一步的痛苦吧！”
items.artifacts.timekeepershourglass$timefreeze.name=the world！
items.artifacts.timekeepershourglass$timefreeze.desc=外界的时间已被冻结，现在你可以在一瞬间完成任何行动。该状态会一直持续下去，除非你主动取消了它，或者你的按钮用尽了充能。实施攻击或使用魔法同样会取消该效果。\n\n距离下次消耗充能还有：%s回合
items.artifacts.timekeepershourglass$sandbag.name=“青辉石”
items.artifacts.timekeepershourglass$sandbag.levelup=你用买来的珍惜资源强化了按钮
items.artifacts.timekeepershourglass$sandbag.maxlevel=你的按钮完全强化了！
items.artifacts.timekeepershourglass$sandbag.no_hourglass=你没有按钮来使用这些珍惜道具。
items.artifacts.timekeepershourglass$sandbag.desc=对sensei来说相当珍贵的资源，不要为问为什么信用点能买这个！\n\n买就是了！绝对有用！

items.artifacts.unstablespellbook.name=诺亚笔记
items.artifacts.unstablespellbook.ac_read=阅读
items.artifacts.unstablespellbook.ac_add=加入
items.artifacts.unstablespellbook.blinded=你不能在失明的时候阅读书籍。
items.artifacts.unstablespellbook.no_charge=你的笔记耗尽了能量。
items.artifacts.unstablespellbook.cursed=诺亚：不要偷看哦——
items.artifacts.unstablespellbook.prompt=选择一个卷轴
items.artifacts.unstablespellbook.infuse_scroll=诺亚：记录……好好的完成了哦。
items.artifacts.unstablespellbook.unable_scroll=诺亚：请按待办事项的顺序进行记录哦
items.artifacts.unstablespellbook.unknown_scroll=诺亚：“没有翻译的内容可无法记录呢”
items.artifacts.unstablespellbook.desc=这本外皮精致的笔记本显然是某位千年小书记的随身物，翻开后其上条理清晰分明，字体娟秀的事件记录想必会对战斗大有裨益。
items.artifacts.unstablespellbook.desc_cursed=“呼呼……你在看吧？随意偷看少女的日记可是非常不好的行为哦……呼呼呼……”“作为惩罚…请寻找一张特定的语录摘要来吧～”
items.artifacts.unstablespellbook.desc_index=不过这本笔记本的扉页似乎记载了什么代办事项……如果找到相应的记录插入的话应该能让笔记更加完整。
items.artifacts.unstablespellbook.desc_empowered=扉页的空缺已经完全被你填补完整，此时这本笔记可以让你进一步有效研习卷轴，甚至可以展现出秘卷的力量，但这样也会让你消耗更多充能。
items.artifacts.unstablespellbook.read_empowered=被你记录在笔记里的卷轴充满了能量。你可以自主选择导引出该卷轴的正常或秘卷能力。\n\n如果选择释放秘卷能力，则会消耗2点笔记充能。

items.artifacts.scrunchie.name=发圈
items.artifacts.scrunchie.desc=送给未花的珍贵的发圈。只是看着它，就会产生未知的力量。可以用这股破坏墙壁或强力击打敌人并将其击退。\n\n对相邻位置使用，若为墙壁则将其破坏；若为敌方单位，则对其进行一次伤害+20%的必中攻击并将其击退(3+发圈等级)格。
items.artifacts.scrunchie.ac_use=使用
items.artifacts.scrunchie.need_to_equip=需要装备才能使用它
items.artifacts.scrunchie.cursed=被诅咒的发圈无法使用
items.artifacts.scrunchie.no_charge=发圈没有能量
items.artifacts.scrunchie.invalid_target=目标无效
items.artifacts.scrunchie.not_adjacent=只能对相邻位置使用
items.artifacts.scrunchie.cannot_do_boss=在boss层无法破坏墙壁
items.artifacts.scrunchie.cannot_do_border=无法破坏地图边缘的墙壁
items.artifacts.scrunchie.prompt=选择一个目标
items.artifacts.scrunchie.levelup=发圈升级了!
items.artifacts.scrunchie.cannot_break=无法破坏那个墙壁

items.food.rollcake.name=瑞士卷
items.food.rollcake.desc=作为甜点带来的，非常柔软且甜美的瑞士卷。吃起来很快，恢复少量的饥饿同时还能恢复极少的体力。小心，扔出去就没法吃了。

items.quest.escapecrystal.leaving_kit=_这把枪上的套件似乎是绑在黑镜上的，无法和你一块返回。_\n\n返回时枪支上的套件将被自动移除，强化等级以及其他一些数值会相应的发生变化，但附魔不会被移除。

items.quest.escapecrystal.name=逃脱装置
items.quest.escapecrystal.ac_use=使用
items.quest.escapecrystal.prompt=选择带出的物品
items.quest.escapecrystal.desc=似乎包含瞬间传送科技的奇怪装置。使用此装置可随时离开宝库，但提前离开将无法获得所有奖励！
items.quest.escapecrystal.discover_hint=该物品作为特定任务的道具出现。
items.quest.escapecrystal.injure_warning_1=时间流逝似乎变得迟缓了起来，同时你似乎听见了晶的声音:\n\n“哦，你看起来伤得有点不轻啊，你确定你那边还搞得定吗？我是很想要那座雕像啦，但你要是倒在里面了可对我没好处！”
items.quest.escapecrystal.injure_warning_2=“如果你现在处境不妙的话，可以先用_初始房间里的传送道具_想办法回到那边去，休整好了再重新出去探索。”
items.quest.escapecrystal.injure_warning_3=“假如情况实在严峻到你根本没法解决了，就_使用我给你的装置传送出宝库_吧。当然，那样的话我可就不会给你多少报酬了，那个装置可不是什么便宜货！”
items.quest.escapecrystal.leaving_start=时间流逝似乎变得迟缓了起来，同时你似乎听见了晶的声音:\n\n“听着，我完全理解你可能会有点紧张，但至少也走出第一个房间看看吧？”\n\n“你大可不必担心我把你的装备偷走，我保证你回来的时候它们都会齐齐整整的物归原主。我可是对艺术品才有兴趣，万一你真的遇到危险了，我也肯定会让你传送回来的，我发誓！”
items.quest.escapecrystal.leaving_early=时间流逝似乎变得迟缓了起来，同时你似乎听见了晶的声音:\n\n“真的假的，这就打算跑路了吗!?你明明知道想从宝库里绝大多数敌人的眼前溜走很容易的吧?”\n\n“算了，如果你真的觉得自己现在就有危险了，那我当然会把你传送出来，不过你大概也别想带什么别的宝物回来了。我是真的能指望你帮上点忙呢=(”
items.quest.escapecrystal.leaving_partly_explored=时间流逝似乎变得迟缓了起来，同时你似乎听见了晶的声音:\n\n“哦，打算回来了吗？也行，至少你帮我勘探了一下宝库的布局，聊胜于无吧。”\n\n“唉，我当然是期待你还能多做点什么 =( 。你需要的话我当然会把你传送回来，或许能让你带上个什么药剂或者卷轴回来吧。”
items.quest.escapecrystal.leaving_fully_explored=时间流逝似乎变得迟缓了起来，同时你似乎听见了晶的声音:\n\n“要我把你传送回来了？至少你算是把这片宝库摸索了个大概。托你的福，我现在对宝库里的机关与地形了解的差不多了，不过我还是希望你能再深入探索一下，顺带也替你自己好好搜刮点东西嘛。”\n\n“我会让你带一样东西出来的，不过升级过的物品可不行！”
items.quest.escapecrystal.leaving_partial_victory=时间流逝似乎变得迟缓了起来，同时你似乎听见了晶的声音:\n\n“不错嘛，你已经替我把这座宝库的绝大部分都探索、清理一遍了！虽然我也能自己来，但何不把那座雕像也带出来呢?”\n\n“我就直说吧，你确实帮上了忙，所以只要不是超过+1的物品，你都可以挑出来带走，我也会按约定在楼下把店面准备好的。反正我还得花上些时间安排接下来的行动，布置据点也不会花费太长时间。”
items.quest.escapecrystal.leaving_victory=时间流逝似乎变得迟缓了起来，同时你似乎听见了晶的声音:\n\n“就是那个!干得漂亮!你准备回来了吗？我就在原地，记得来我这把雕像给我。”\n\n“按咱们谈好的，我会把据点设在楼下不远处，你也可以任选一件东西一块带出来！慢慢挑吧，毕竟宝库里剩下的东西你可拿不出来。”
items.quest.escapecrystal.leaving_item=你确定这就是你想带走的物品吗？
items.quest.escapecrystal.leaving_seal=_贴附在这件护甲上的千年徽章与宝库中的黑镜紧密联系，你无法将它带出宝库。_离开时，纹章会自动从护甲上剥落并使其等级降低一级，但不会带走其上原有的刻印。
items.quest.escapecrystal.leaving_staff=_这把法师魔杖与宝库中的黑镜紧密联系，其本身无法被带出宝库，但你可以带走其中原本灌注的法杖。_离开时，法杖会以比魔杖低一级的属性被自动剥离出来。
items.quest.escapecrystal.leaving_yes=离开宝库
items.quest.escapecrystal.leaving_no=留在这里
items.quest.escapecrystal.error_start=似乎你并不处于宝库层中！可能是bug或崩溃导致的。
items.quest.escapecrystal.error_no_items=你还没有把物品存放好，水晶已经从你的背包中移除。
items.quest.escapecrystal.error_with_items=你背包里的物品已经存放好了，现在可以再度进入宝库以开始任务。存起来的物品会在任务结束时归还。