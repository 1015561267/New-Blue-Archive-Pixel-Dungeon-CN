items.weapon.melee.gun.smg.smg_t4.desc=4阶的SMG，性能优良。
items.weapon.melee.gun.smg.smg_t5.name=5阶SMG
items.weapon.melee.gun.smg.smg_t5.desc=5阶的SMG，性能惊人地强大。
items.weapon.melee.gun.smg.twindragon.name=双龙
items.weapon.melee.gun.smg.twindragon.desc=妮露使用的双持冲锋枪。\n两把枪身都刻着黄金之龙的美丽花纹。
items.weapon.melee.gun.smg.twindragon.stats_desc=这把枪的射击精准度只有常规的一半，但射击次数是常规的两倍。
items.weapon.melee.gun.smg.twindragon.discover_hint=通过在炼金配方中使用_SMG_来发现这把特殊枪支。
items.weapon.melee.gun.smg.beyondthelumination.name=Beyond the Lumination(超越沉思)
items.weapon.melee.gun.smg.beyondthelumination.desc=小夏手里的冲锋枪。\n对于爱思考的她来说，拿出这把枪基本意味着“最终手段”。
items.weapon.melee.gun.smg.beyondthelumination.stats_desc=这把枪可以额外防御_0-%1$d_点物理伤害，最大值随强化等级提高而增加。\n该枪支对远距离的射击命中率较低，但对相邻敌人的射击命中率更高。\n每次使用该枪支承受物理伤害时，累积与阻挡伤害上限相同点数的充能，充能满30点则立刻给自己治疗1点生命值。
items.weapon.melee.gun.smg.beyondthelumination.typical_stats_desc=这把枪通常可以额外防御_0-%1$d_点物理伤害，最大值随强化等级提高而增加。\n该枪支对远距离的射击命中率较低，但对相邻敌人的射击命中率更高。\n每次使用该枪支承受物理伤害时，累积与阻挡伤害上限相同点数的充能，充能满30点则立刻给自己治疗1点生命值。
items.weapon.melee.gun.smg.beyondthelumination.discover_hint=通过在炼金配方中使用_SMG_来发现这把特殊枪支。

