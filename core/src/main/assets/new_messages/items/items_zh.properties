items.weapon.melee.gun.sr.sr_t5.desc=5阶的SR，性能惊人地强大。
items.weapon.melee.gun.sr.sr_sp.name=反器材SR
items.weapon.melee.gun.sr.sr_sp.desc=6阶的反器材SR.具有毁灭性的性能。太重了，无法投掷出去。
items.weapon.melee.gun.sr.sr_sp.stats_desc=这把枪的射击可以穿透并击碎一格墙壁。若子弹没有破坏墙壁，则击退击中的敌人。\n放下或重新装填时会丢弃这把枪支并换回原先的武器。

items.weapon.melee.gun.sr.justiceincarnate.name=正义的显现
items.weapon.melee.gun.sr.justiceincarnate.desc=真白作为正义实现委员会活动的时候使用的狙击步枪。\n本来并不是适合随身携带的大小，但真白说：在正义面前那又有什么关系呢。
items.weapon.melee.gun.sr.justiceincarnate.stats_desc=这把枪的射击伤害及其成长更低。\n\n这把枪在射击命中时，有概率再对敌人造成一次数值相同的额外伤害，概率与强化等级有关。
items.weapon.melee.gun.sr.justiceincarnate.discover_hint=通过在炼金配方中使用_SR_来发现这把特殊枪支。

items.weapon.melee.gun.sr.wineredadmire.name=Wine-red Admire
items.weapon.melee.gun.sr.wineredadmire.desc=阿露平时十分重视，古风设计的狙击步枪。\n仅仅是拿着它，好像……冷硬的程度就提升了。
items.weapon.melee.gun.sr.wineredadmire.stats_desc=这把枪的射击伤害及其成长更低。\n这把枪在射击命中时，有概率在命中位置产生一次爆炸，概率与强化等级有关。
items.weapon.melee.gun.sr.wineredadmire.discover_hint=通过在炼金配方中使用_SR_来发现这把特殊枪支。

items.weapon.melee.gun.mt.fancylight.name=Fancy Light
items.weapon.melee.gun.mt.fancylight.desc=响爱用的迫击炮。\n经常在每天的实验中使用，除了炮弹以外也可以发射各种各样的东西。
items.weapon.melee.gun.mt.fancylight.stats_desc=迫击炮的攻击速度较慢，可以在不装备的情况下直接射击，但射速会进一步变慢。\n射击的炮弹可以无视墙壁，但对视野内的敌人命中率极低。\n它还可以通过消耗炸弹来装填，立即随机装填1~4发可无视上限的弹药，并在再次装填前每次射击都会在目标位置立即引爆一个装填炸弹的复制品。
items.weapon.melee.gun.mt.fancylight.discover_hint=通过在炼金配方中使用_GL_来发现这把特殊枪...不，迫击炮。
items.weapon.melee.gun.mt.fancylight.bomb=目前已装填_%s_, 射击将在目标位置制造一个复制并立刻爆炸
items.weapon.melee.gun.mt.fancylight.ac_bomb=装填炸弹
items.weapon.melee.gun.mt.fancylight.inv_prompt=请选择物品


