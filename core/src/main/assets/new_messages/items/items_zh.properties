items.artifacts.driedrose$ghosthero.seen_dm300_2=真是个大家伙...枪械也没办法伤到它吧？
items.artifacts.driedrose$ghosthero.seen_dm300_3=如果星野妹妹和大家在这里就好了......一定可以齐心协力打败这个大家伙的!
