items.artifacts.etherealchains.desc_cursed=“哈？！不做好训练就想用这个道具？摔骨折了可别怪我没提醒你！”
items.artifacts.etherealchains.desc_equipped=击败敌人的话还可以用她们的掉落物增加锁链的长度，可谓是以战养战！\n“这条锁链没有钩子也没有箭头，是怎么把敌人拉向自己的？”\n“简单！只需要用力抽向对方，一次不行就两次！迟早会把她抽过来的！”\n“……不愧是妮露部长。”
items.artifacts.etherealchains$chainsrecharge.levelup=妮露：你小子，好样的啊！这么快就让链子更顺手了！

