items.artifacts.driedrose$ghosthero.dialogue_prison_5=呜哇！这些骨头动起来了！好奇怪！
items.artifacts.driedrose$ghosthero.dialogue_prison_6=不知道星野妹妹现在做什么呢……
items.artifacts.driedrose$ghosthero.dialogue_caves_1=我还是第一次来到洞穴！景色不错！
items.artifacts.driedrose$ghosthero.dialogue_caves_2=墙壁上有很多亮晶晶的小玩意！可以带走吗？
items.artifacts.driedrose$ghosthero.dialogue_caves_3=这些家伙掉了好多信用点，带回去的话后辈们能轻松不少…
items.artifacts.driedrose$ghosthero.dialogue_caves_4=我捡了好多形状特异的钟乳石！（左脚绊右脚摔倒）呜哇…掉到岩缝里了
