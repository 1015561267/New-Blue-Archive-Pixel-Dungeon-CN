items.artifacts.alchemiststoolkit.cursed=你手里的砂锅咬了你一口，虽然不疼，但可以看出它不允许你碰其他的炼金锅！”
items.artifacts.alchemiststoolkit.need_energy=你需要至少6点能量才能那么做。
items.artifacts.alchemiststoolkit.energize_desc=每6个能量晶体可投喂砂锅里的小家伙进行一次升级，这能增加砂锅随时间自然产生的能量。并且更快地进行预热。\n\n你打算为本次炼金实验花费多少能量呢？
items.artifacts.alchemiststoolkit.energize_1=6能量：+1级
items.artifacts.alchemiststoolkit.energize_all=%1$d能量：+%2$d级
items.artifacts.alchemiststoolkit.desc=朱莉用于进行烹饪的锅，里面各种食材在她的“精心烹饪”下已经开始扭曲成为一团诡异的色彩…时不时翻涌出一股气泡\n这已经不能被称为锅了…叫它炼金釜更合适…
items.artifacts.alchemiststoolkit.desc_cursed=为什么锅会咬人啊！我不明白！”\n“咬人就算了，又为什么不让我碰别的炼金锅啊！”
items.artifacts.alchemiststoolkit.desc_warming=砂锅正在预热中，过一会儿才能再次使用。
items.artifacts.alchemiststoolkit.desc_hint=手中的砂锅正随着你获得经验值缓慢生成炼金能量。锅里的小家伙似乎可以通过投喂能量来升级。

