items.weapon.melee.gun.gl.springpunch.name=春宾治(Spring Punch)
items.weapon.melee.gun.gl.springpunch.desc=时雨平时随身携带的榴弹发射器。\n正如这把枪的名字一样，被它直接击中的人会变得摇摇晃晃醉醺醺的。
items.weapon.melee.gun.gl.springpunch.stats_desc=这把枪的射击伤害上限及其成长都更低，但是射击的榴弹爆炸不会对自己造成伤害，而且会击退被波及到的单位。\n而且，射击对处于麻痹状态下的敌人有+50%的额外伤害。
items.weapon.melee.gun.gl.springpunch.discover_hint=通过在炼金配方中使用_GL_来发现这把特殊枪支。

items.weapon.melee.gun.hg.hg_t1.name=1阶HG
items.weapon.melee.gun.hg.hg_t1.desc=1阶的HG，只有最低限度的性能。
items.weapon.melee.gun.hg.hg_t2.name=2阶HG
items.weapon.melee.gun.hg.hg_t2.desc=2阶的HG，性能较弱但总体及格。
items.weapon.melee.gun.hg.hg_t3.name=3阶HG
items.weapon.melee.gun.hg.hg_t3.desc=3阶的HG，具有良好的性能。
items.weapon.melee.gun.hg.hg_t4.name=4阶HG
items.weapon.melee.gun.hg.hg_t4.desc=4阶的HG，性能优良。
items.weapon.melee.gun.hg.hg_t5.name=5阶HG
items.weapon.melee.gun.hg.hg_t5.desc=5阶的HG，性能惊人地强大。
items.weapon.melee.gun.hg.piety.name=怜悯
items.weapon.melee.gun.hg.piety.desc=玛丽所持手枪。\n平时随身携带，但实际上从没有听见过它开火的声音。
items.weapon.melee.gun.hg.piety.stats_desc=这把枪相较于常规手枪射速更慢，载弹量更少，但射击伤害上限更高，且对恶魔和亡灵敌人必定造成最大伤害。
items.weapon.melee.gun.hg.piety.discover_hint=通过在炼金配方中使用_HG_来发现这把特殊枪支。
items.weapon.melee.gun.hg.chistka.name=肃清(чистка)
items.weapon.melee.gun.hg.chistka.desc=切里诺肃清时使用的手枪。\n无需扣动扳机，只要将枪口对准，大喊：“肃清！”，便成了红冬的肃清对象。
items.weapon.melee.gun.hg.chistka.stats_desc=这把枪的射击有2%几率立即肃清敌人，每级强化等级使得概率+1%。被肃清的敌人不会掉落经验值。
items.weapon.melee.gun.hg.chistka.discover_hint=通过在炼金配方中使用_HG_来发现这把特殊枪支。
items.weapon.melee.gun.hg.chistka.purge=肃清!


