items.artifacts.driedrose$petal.no_rose=你没有笔记来添加这片残页。
items.artifacts.driedrose$petal.no_room=栀子梦：笔记已经放不下了哦…
items.artifacts.driedrose$petal.maxlevel=栀子梦：所有的回忆都找齐了！谢谢你！
items.artifacts.driedrose$petal.levelup=你将残页夹入了笔记里。
items.artifacts.driedrose$petal.desc=一些记载了琐碎日常的纸张，似乎出自你手里的笔记本。

items.artifacts.driedrose$wndghosthero.title=梦前辈的装备
items.artifacts.driedrose$wndghosthero.desc=这个形态下的梦前辈本身十分脆弱，但她的形体已经完整到足以装备一件武器和防具。她可以和你一样自如使用这些装备。\n\n梦前辈目前最高可装备_力量需求为%d_的物品。
