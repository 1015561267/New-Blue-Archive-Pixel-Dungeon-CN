items.artifacts.hornofplenty.desc_hint=你也可以选择直接投入食材来让枫香做出更多美味
items.artifacts.hornofplenty.desc_cursed=……显然这个锅让朱莉拿去做了些什么，上面的食物散发着诡异的色彩，甚至好像还有了生命…在你食用自己的食物时这群家伙也会扑出来吃掉你的部分食物让你更难吃饱。

