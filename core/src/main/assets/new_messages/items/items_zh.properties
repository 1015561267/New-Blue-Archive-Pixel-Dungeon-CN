items.artifacts.driedrose$ghosthero.desc=这抹青绿色的身影是阿拜多斯前学生会长，现以精神状态与你共同探索地牢，身形飘渺，但脸上那抹温暖治愈的微笑却无比清晰，她的力量似乎与你手中的笔记本息息相关。\n\n虽然有时候她冒冒失失的弄出不少岔子，但她想要照顾保护你的心愿却没有半分改变，有她在你身边，好像这场枯燥的行程都变的有趣起来了呢。

