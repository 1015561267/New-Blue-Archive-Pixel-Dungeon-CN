items.weapon.melee.gun.mg.mulligan.name=额外机会
items.weapon.melee.gun.mg.mulligan.desc=与小雪一同跨越了一切困难的机关枪。曾在一次维修时更换了涂装颜色。与不拘小节的小雪非常相似的结实的枪。
items.weapon.melee.gun.mg.mulligan.stats_desc=这把枪在命中时会对敌人随机触发诅咒法杖的效果。强化等级越高，效果就有更大的概率变为无害或有益。
items.weapon.melee.gun.mg.mulligan.discover_hint=通过在炼金配方中使用_MG_来发现这把特殊枪支。
items.weapon.melee.gun.mg.trickortrick.name=给糖也捣蛋(Trick or Trick)
items.weapon.melee.gun.mg.trickortrick.desc=睦月随身携带的机关枪。\n据睦月所说，为了更有趣的恶作剧，火力也很重要呢。
items.weapon.melee.gun.mg.trickortrick.stats_desc=这把枪极为沉重，力量需求更高，但相应的射击伤害上限也更高一点。
items.weapon.melee.gun.mg.trickortrick.discover_hint=通过在炼金配方中使用_MG_来发现这把特殊枪支。

items.weapon.melee.gun.mg.mg_sp.name=小型机关枪Ⅴ
items.weapon.melee.gun.mg.mg_sp.desc=野宫使用的机关枪。\n与名字里的“小型”正相反，相当大。当野宫升到20级时它会更强大！
items.weapon.melee.gun.mg.mg_sp.stats_desc=当野宫升到20级时它会更强大！
items.weapon.melee.gun.mg.mg_sp.discover_hint=通过点出_特定的学生天赋_来发现这把特殊枪支。

