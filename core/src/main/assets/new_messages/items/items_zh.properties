items.artifacts.driedrose$ghosthero.dialogue_city_4=好压抑的气氛…此地不宜久留。快走快走。
items.artifacts.driedrose$ghosthero.dialogue_city_5=那些人眼里没有光…是遭遇了什么嘛？
items.artifacts.driedrose$ghosthero.dialogue_city_6=总觉得前面有什么更可怕的存在……
items.artifacts.driedrose$ghosthero.dialogue_halls_1=这是什么地方啊？
items.artifacts.driedrose$ghosthero.dialogue_halls_2=这里太可怕了...不过前辈不会害怕哦！
items.artifacts.driedrose$ghosthero.dialogue_halls_3=视线越来越窄了…不要走散了，来牵着我的手吧？
items.artifacts.driedrose$ghosthero.dialogue_halls_4=这些的怪物比之前遇到的都要诡异，不要勉强自己！
items.artifacts.driedrose$ghosthero.dialogue_halls_5=感觉到了吗？好像有什么东西在盯着我们。
items.artifacts.driedrose$ghosthero.dialogue_halls_6=好黑……还好我们有火把！
items.artifacts.driedrose$ghosthero.dialogue_ascension_1=我们现在可以回家了吗？
items.artifacts.driedrose$ghosthero.dialogue_ascension_2=都到这里了，不能功亏一篑！
