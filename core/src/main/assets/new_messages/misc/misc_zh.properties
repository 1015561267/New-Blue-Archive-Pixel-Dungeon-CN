### new challenges
challenges.chaotic_scent=混乱气体
challenges.chaotic_scent_desc=不知怎么的会飘出混乱的气体...\n\n- 每经_30_±回合在敌人附近生成一团有害气体。\n- 气体只有在敌人周围时才能喷出。\n- 实际上该挑战会视作强制携带_+3混沌香炉_，故不会和该饰物效果叠加。
challenges.angry_enemies=起床气
challenges.angry_enemies_desc=妨碍完美睡眠的东西都很烦人！如果是你，那愤怒的矛头也当然会指向你...\n\n- 敌人在从睡眠中醒来时，获得_10回合激素涌动_。\n- 仅限普通睡眠，从_魔法睡眠_中醒来不会触发该效果。
challenges.nutrition_lack=营养不良
challenges.nutrition_lack_desc=营养不良的话，伤口也不会好起来。\n\n- 极度饥饿的情况下，受到物理伤害时有1/5几率额外受到_极少量的流血状态_。\n- 由该效果产生的流血_在触发进食时会立即解除_。

gameerror.title=发生错误
gameerror.desc=出现错误。可考虑将错误内容复制给译者。\n_（已复制到剪贴板）_