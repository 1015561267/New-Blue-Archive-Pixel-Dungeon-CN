journal.document.intros.sewers.title=千年废墟下水道
journal.document.intros.sewers.body=不知为什么，千年学院的废墟下水道由总学生会规定禁止出入。\n\n废墟下下水道的无害生命体因为从更下方升起的黑暗气息而变得越来越危险，但总学生会的禁令难道只是为了保障学生的安全么？\n\n虽然这里是危险的地方，但邪恶的气息并不强烈。
journal.document.intros.prison.title=阿拜多斯大厦废墟
journal.document.intros.prison.body=随着沙漠化的长期进行，阿拜多斯自治区的废墟建筑越来越多。\n\n被无数沙子覆盖的大楼被侵蚀和倒塌，现在只能显示出过去一部分的辉煌。\n\n这是一个危险的地方，但丰富的往昔遗产可能会有用。..
journal.document.intros.caves.title=红冬联邦学院地下
journal.document.intros.caves.body=红冬学院辽阔的占地导致非常容易迷路，而复杂的结构也带来了管理上的困难。\n\n虽然不知道为什么，但这里的建筑物墙壁镶嵌着有价值的宝石，墙上到处都是。\n\n有人为了获得宝石，胡乱挖掘建筑物，破坏了建筑物的结构...

