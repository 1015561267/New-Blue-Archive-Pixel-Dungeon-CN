scenes.heroselectscene.title=选择一位学生
scenes.heroselectscene.daily_desc=每天都会有一局对所有玩家都一样的新游戏可供游玩！“每日挑战”的种子固定，所以会为所有玩家生成相同的地牢(前提是他们所玩的游戏版本也相同)。\n\n你可以不受时限地完成每日挑战，但同时只能进行一局每日挑战。_每日挑战无法获得徽章，而享有独立的排行榜页面。_\n\n你想以当前选择的学生与挑战开启今天的每日挑战吗？
scenes.heroselectscene.daily_repeat=你已经游玩过了今天的每日挑战。你当然可以反复游玩它，但仅有练习的意义，只有第一次游玩的数据能参与排位。\n\n当你再次完成今天的每日挑战之后，你依旧可以在排位界面查看其数据，只是该数据会很快被删除。\n\n你想要使用当前选中的学生与挑战重玩今天的每日挑战吗？
scenes.heroselectscene.randomize_hero=随机选择

